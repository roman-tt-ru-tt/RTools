plugins {
    id 'com.android.application'
}

android {
    namespace 'gtandroid.universal'
    compileSdk 33

    defaultConfig {
        applicationId "gtandroid.universal"
        minSdk 21
        targetSdk 33
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Original decompiled manifest already declares its own permissions/components.
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // No external dependencies required — project only uses android.* and org.json.* (bundled in the SDK)
}
