plugins {
    id 'com.android.application'
}

android {
    namespace 'gtandroid.universal'
    compileSdk 33

    defaultConfig {
        applicationId "gtandroid.universal"
        minSdk 21
        targetSdk 33
        versionCode 3
        versionName "1.2"
    }

    signingConfigs {
        release {
            storeFile file("rtools-release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "rtools2024"
            keyAlias System.getenv("KEY_ALIAS") ?: "rtools"
            keyPassword System.getenv("KEY_PASSWORD") ?: "rtools2024"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
}
